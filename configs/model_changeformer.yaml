# Parametros del modelo ChangeFormer (valores por defecto del repositorio oficial)
model:
  net_G: "ChangeFormerV6"
  embed_dim: 256
  n_class: 2
  in_chans: 3
  img_size: 256
  multi_scale_infer: false
  patch_embed_sizes: [[7, 7], [3, 3], [3, 3], [3, 3]]

pretrained:
  # Pesos de segmentacion ADE20k usados para inicializar el encoder en el entrenamiento original
  segformer_ade: "third_party/ChangeFormer/pretrained_segformer/segformer.b2.512x512.ade.160k.pth"
  # Pesos finales de deteccion de cambios (LEVIR-CD / DSIFN-CD)
  levir_cd: "checkpoints/ChangeFormer_LEVIR/best_ckpt.pt"
  dsifn_cd: "checkpoints/ChangeFormer_DSIFN/best_ckpt.pt"

checkpoint:
  # Claves posibles dentro del archivo .pt
  state_dict_keys: ["model_G_state_dict", "state_dict", "model"]
